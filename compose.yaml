services:
  app:
    build: .
    ports:
      - "127.0.0.1:8094:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      APP_DATA_DIR: /var/www/html/var/data
    volumes:
      - workspace-data:/var/www/html/var/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === 'ok' ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace-data:
